name: Cleanup uploaded files

on:
  schedule:
    # UTC 04:00/16:00 = Asia/Shanghai 12:00/00:00; scheduled runs may be delayed.
    - cron: "0 4,16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview expired files without deleting or committing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: repository-maintenance-main
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete uploaded files older than 24 hours
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import time

          retention_seconds = 24 * 60 * 60
          now = int(time.time())
          dry_run = os.environ.get("DRY_RUN", "true").lower() == "true"
          # Only tracked uploads; repository configuration and README are excluded.
          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "eventarchive/", "incidents/", "exceptions/", "target-rank/", "overview/"]
          ).decode("utf-8").split("\0")
          expired = []
          for path in sorted(path for path in paths if path and not path.endswith("/.gitkeep")):
              output = subprocess.check_output(
                  ["git", "--literal-pathspecs", "log", "-1", "--format=%ct", "--", path],
                  text=True,
              ).strip()
              if not output:
                  raise RuntimeError("Missing Git timestamp: " + path)
              if now - int(output) > retention_seconds:
                  expired.append(path)
          # Complete timestamp validation before changing any files.
          for path in expired:
              print(("Would delete: " if dry_run else "Deleting: ") + path)
              if not dry_run:
                  os.unlink(path)
          print("Expired files: {}; dry_run={}".format(len(expired), str(dry_run).lower()))
          PY

      - name: Commit cleanup
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          if git diff --quiet -- eventarchive/ incidents/ exceptions/ target-rank/ overview/; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "cleanup uploaded files older than 24 hours"
          # Never force-push or overwrite concurrent uploads; conflicts fail visibly.
          git push origin HEAD:main
